<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit Log — Codex PREP Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/theme.css">
<style>
  .log-card{padding:14px 16px;margin-bottom:10px}
  .log-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
  .log-admin{font-size:.78rem;font-weight:800;color:var(--violet-deep)}
  .log-date{font-size:.7rem;color:var(--muted);white-space:nowrap}
  .log-target{font-size:.86rem;font-weight:700;color:var(--ink);margin-bottom:4px}
  .log-change{font-size:.8rem;color:var(--muted)}
  .tier-tag{font-weight:800;text-transform:uppercase;font-size:.72rem}
  .empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:.86rem}
</style>
</head>
<body>

<div class="top-bar">
  <div class="top-bar-logo">Codex <span>PREP</span> <span style="opacity:.6;font-size:.7em">· Admin</span></div>
  <div class="spacer"></div>
  <a class="icon-btn" href="index.html">← Admin</a>
</div>

<div class="page-wrap" id="authGate" style="padding-top:60px">
  <div class="loading-msg">Checking access...</div>
</div>

<div class="page-wrap" id="adminContent" style="display:none">
  <div class="page-header">
    <div class="eyebrow">Security</div>
    <h1>Audit Log</h1>
    <p>A permanent record of every plan change made from this admin panel — who did it, to whom, and when. Entries can never be edited or deleted, by anyone, even other admins.</p>
  </div>

  <div id="logList"></div>
</div>

<script type="module">
import { requireAdmin, db, collection, getDocs, query, orderBy, limit } from "../js/auth.js";

requireAdmin(async () => {
  document.getElementById('authGate').style.display = 'none';
  document.getElementById('adminContent').style.display = 'block';

  const wrap = document.getElementById('logList');
  try {
    const q = query(collection(db, "admin_audit_log"), orderBy("timestamp", "desc"), limit(200));
    const snap = await getDocs(q);

    if (snap.empty) {
      wrap.innerHTML = '<div class="card empty">No admin actions logged yet — this fills in as tier changes happen from now on.</div>';
      return;
    }

    snap.forEach(docSnap => {
      const d = docSnap.data();
      const date = d.timestamp && d.timestamp.toDate ? d.timestamp.toDate().toLocaleString() : '';
      const card = document.createElement('div');
      card.className = 'card log-card';
      card.innerHTML = `
        <div class="log-head">
          <span class="log-admin">${escapeHtml(d.adminEmail || 'unknown admin')}</span>
          <span class="log-date">${date}</span>
        </div>
        <div class="log-target">${escapeHtml(d.targetEmail || d.targetUid || 'unknown user')}</div>
        <div class="log-change">
          Changed plan: <span class="tier-tag">${escapeHtml(d.oldTier || '?')}</span> → <span class="tier-tag" style="color:var(--violet)">${escapeHtml(d.newTier || '?')}</span>
        </div>
      `;
      wrap.appendChild(card);
    });
  } catch (e) {
    console.error(e);
    wrap.innerHTML = '<div class="card empty">Could not load the audit log — check your connection and try again.</div>';
  }
});

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
<script src="../js/icons.js"></script>
</body>
</html>
